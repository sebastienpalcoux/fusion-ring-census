name: Independently audit laptop rank 6 multiplicity 7
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: census-candidate-review
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check received file hashes
        working-directory: verification/candidates/rank6_M7_laptop
        run: sha256sum --check SHA256SUMS
      - name: Reverify all tensors and promote only in the disposable checkout
        run: |
          set -o pipefail
          mkdir -p review
          python3 scripts/promote_result.py verification/candidates/rank6_M7_laptop 2>&1 | tee review/verification.log
          python3 - <<'PY'
          import json,os,platform,subprocess
          from pathlib import Path
          d={'source':'user laptop archive received 2026-09-20',
             'verification_run_id':os.environ['GITHUB_RUN_ID'],
             'verification_commit':os.environ['GITHUB_SHA'],
             'python':platform.python_version(),'system':platform.platform(),
             'compiler':subprocess.check_output(['g++','--version'],text=True),
             'command':'python3 scripts/promote_result.py verification/candidates/rank6_M7_laptop',
             'rank':6,'bound':7,'classes':9613,'complete':True,'verified':True}
          Path('verification/imports/rank6_through7/review.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          echo 'Rank 6 through multiplicity 7: 9,613 classes reverified; 3,814 at exact multiplicity 7. Ready for reviewed integration.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rank6-m7-laptop-review-diagnostics-${{ github.run_id }}
          path: review/verification.log
          retention-days: 14
      - name: Preserve verified integration files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rank6-m7-laptop-verified-integration-${{ github.run_id }}
          path: |
            results/census.json
            results/rank6_through7_*.txt.gz
            verification/imports/rank6_through7/
          if-no-files-found: error
          retention-days: 14
