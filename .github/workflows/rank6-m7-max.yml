name: Rank 6 multiplicity 7 — maximum hosted job
run-name: Rank 6 through 7 — six-hour ceiling, verified artifacts only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: census-frontier
  cancel-in-progress: false
jobs:
  census:
    if: github.run_attempt == 1 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record source and environment
        run: |
          mkdir -p frontier
          { git rev-parse HEAD; python3 --version; g++ --version; uname -a; nproc; free -h; df -h .; } > frontier/environment.txt
      - name: Complete only rank 6 through multiplicity 7
        run: |
          python3 scripts/extend_census.py --rank 6 --rank6-m7-max \
            --seconds 21300 --max-bound 7 --threads "$(nproc)" --out frontier/rank6
      - name: Save complete candidate and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rank6-m7-max-${{ github.run_id }}
          path: |
            frontier/environment.txt
            frontier/rank6/best/
            frontier/rank6/frontier.json
            frontier/rank6/SUMMARY.md
            frontier/rank6/diagnostics/
            frontier/rank6/attempt_*.log
          if-no-files-found: error
          retention-days: 14
