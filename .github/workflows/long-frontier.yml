name: Long census frontier (ranks 5–8)
run-name: Long whole-rank frontier 5–8 (70 minutes per rank)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: census-frontier
  cancel-in-progress: false
jobs:
  census:
    # A rerun must not silently grant a second budget to the same campaign.
    if: github.run_attempt == 1
    name: Rank ${{ matrix.rank }} — complete results only
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rank: [5, 6, 7, 8]
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record source and runner environment
        run: |
          mkdir -p frontier
          {
            git rev-parse HEAD
            python3 --version
            g++ --version
            uname -a
            nproc
            free -h
            df -h .
          } > frontier/environment.txt
      - name: Search successive whole-rank bounds within one shared budget
        env:
          RANK: ${{ matrix.rank }}
        run: |
          python3 scripts/extend_census.py --rank "$RANK" --seconds 4200 \
            --threads "$(nproc)" --out "frontier/rank$RANK"
      - name: Preserve last verified candidate and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: long-whole-rank-${{ matrix.rank }}-${{ github.run_id }}
          path: |
            frontier/environment.txt
            frontier/rank${{ matrix.rank }}/best/
            frontier/rank${{ matrix.rank }}/frontier.json
            frontier/rank${{ matrix.rank }}/SUMMARY.md
            frontier/rank${{ matrix.rank }}/diagnostics/
            frontier/rank${{ matrix.rank }}/attempt_*.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
